cli:
  help: "Wyoming TTS Service - OpenVINO Multilingual Kokoro Speech Synthesis"
  options:
    model_dir: "Kokoro OpenVINO model directory (containing openvino_model.xml and voices/ directory)"
    host: "Server listening host address"
    port: "Server listening port (default 10021)"
    device: "OpenVINO inference device (default CPU; Kokoro on CPU is ultra-fast with best compatibility)"
    threads: "OpenVINO CPU inference thread count (default None for auto optimization)"
    language: "Global default language (auto / zh / ja / en / es / fr etc.)"
    voice: "Global default voice name (e.g. zf_xiaobei, jf_alpha, af_heart; auto-selected if not specified)"
    speed: "Speech speed multiplier (recommended 0.85 for natural cadence; >1.0 faster, <1.0 slower)"
    sample_rate: "Audio sample rate in Hz (Kokoro default 24000)"
    cache_dir: "OpenVINO model compilation persistent cache directory (defaults to .ov_cache inside model dir)"
    max_chunk_chars: "Streaming text clause maximum character length (default 65; zh 50-80, en 60-100)"
    bucket_shapes: "Enable input shape bucketing (defaults to True on GPU to eliminate JIT compilation pauses)"

log:
  pipeline_frontend: "Using Kokoro native KPipeline frontend (lang_code={lang_code}, model=False)"
  init_en_g2p: "Initializing English G2P (dialect={dialect})"
  init_ja_g2p: "Initializing Japanese G2P (misaki.ja.JAG2P)"
  init_zh_g2p: "Initializing Chinese G2P (misaki.zh.ZHG2P)"
  zh_config: "Chinese G2P config: version={version} (native zhuyin: {zhuyin})"
  init_other_g2p: "Initializing G2P engine for language '{lang_code}'"
  espeak_fallback: "espeak-ng not configured, falling back to English G2P: {error}"
  g2p_error: "G2P conversion exception ('{text}'): {error}, falling back to plain text mapping"
  phoneme_miss: "Phoneme '{phoneme}' (text: '{text}') not found in vocabulary"
  voice_skip: "Voice '{voice}' in blend not found, skipped"
  blend_success: "Successfully created voice blend: '{spec}' (mixed {count} voices)"
  vocab_loaded: "Successfully loaded {path} vocabulary ({tokens} tokens)"
  config_error: "Exception parsing {path}: {error}"
  voice_file_skip: "Skipping voice file {name}: {error}"
  voice_archive_error: "Exception parsing bundled voice {src}: {error}"
  no_preset_voices: "No preset voice files found in model directory, initializing base virtual reference voice..."
  voices_loaded: "Loaded {count} voices (first voice: {first_voice})"
  loading_model: "Loading and compiling OpenVINO model: {model} (device: {device})"
  threads_set: "OpenVINO inference threads set to: {threads}"
  model_ready: "🎉 OpenVINO model ready (LATENCY mode)"
  inference_failed: "OpenVINO inference failed: {error}"
  empty_text: "Received empty text, sending silence"
  request: "🎙️ TTS request: language={lang} (detected={detected}), voice={voice}, speed={speed:.2f}, text: {text}"
  chunks_split: "Long text split into {count} streaming sentence clauses: {chunks}"
  chunk_output: "Clause [{index}/{total}] streaming output sent: '{text}' (time: {time:.2f}s, tokens={tokens}, audio: {duration:.2f}s)"
  synthesis_complete: "✅ Text synthesis and streaming dispatch completed!"
  starting_service: "Starting Wyoming Kokoro-OpenVINO Multilingual TTS Service..."
  default_voice: "🎙️ Default voice: {voice} (voice library total: {count} voices)"
  ha_registered_langs: "Registered language ecosystem with Home Assistant: {langs}"
  cache_dir_info: "Model compilation cache directory: {path}"
  bucketing_info: "Shape bucketing: {status} (buckets: {buckets})"
  gpu_bucket_warmup: "⚡ Warming up all fixed shape bucket kernels on GPU (buckets: {buckets})..."
  gpu_warmup: "⚡ GPU device detected, executing multi-scale dynamic shape warm-up (compiling & caching GPU kernels)..."
  gpu_warmup_done: "🎉 GPU multi-scale kernel warm-up and persistent cache build complete!"
  hetero_gpu_tip: "💡 Tip: If GPU drivers and operators are fully supported, try pure --device GPU to avoid heterogeneous cross-device memory copying."
  warmup_start: "Running background engine warm-up..."
  warmup_done: "🎉 Engine warm-up complete! First request will achieve sub-second response."
  warmup_skip: "Warm-up skipped or ignored: {error}"
  service_ready: "🌟 Wyoming Kokoro-OpenVINO TTS Service started successfully!"
  listen_addr: "Listening address: tcp://{host}:{port}"
  device_info: "Inference device: {device}"
  speed_info: "Default speed: {speed:.2f}"
  voice_info: "Default voice: {voice}"
  service_stopped: "Service stopped manually."

wyoming:
  program_description: "Kokoro-82M multilingual text-to-speech (OpenVINO high-speed inference)"

languages:
  en: "English"
