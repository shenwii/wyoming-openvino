cli:
  help: "Wyoming TTS 服务 - 基于 OpenVINO 的多语言 Kokoro 语音合成"
  options:
    model_dir: "Kokoro OpenVINO 模型目录（含 openvino_model.xml 及 voices/ 目录）"
    host: "服务监听地址"
    port: "服务监听端口（默认 10021）"
    device: "OpenVINO 推理设备（默认 CPU，Kokoro 在 CPU 上极快且兼容性最佳）"
    threads: "OpenVINO CPU 推理线程数（默认 None 自适应优化）"
    language: "全局默认语言（auto / zh / ja / en / es / fr 等）"
    voice: "全局默认发音人名称（如 zf_xiaobei, jf_alpha, af_heart，不填则自动推选）"
    speed: "语速倍率（推荐 0.85 获得更从容清丽自然的听感，>1.0 加速，<1.0 减速）"
    sample_rate: "音频采样率（Hz），Kokoro 默认 24000"
    cache_dir: "OpenVINO 模型编译持久化缓存目录（默认存放在模型目录下的 .ov_cache 目录中）"
    max_chunk_chars: "流式分句最大字符长度（默认 65，中文推荐 50-80，英文推荐 60-100）"
    bucket_shapes: "是否启用输入 Shape 强制分桶（GPU 模式下默认自动开启以彻底杜绝 JIT 重编译卡顿）"

log:
  pipeline_frontend: "使用 Kokoro 原生 KPipeline 前端 (lang_code={lang_code}, model=False)"
  init_en_g2p: "初始化英文 G2P (dialect={dialect})"
  init_ja_g2p: "初始化日文 G2P (misaki.ja.JAG2P)"
  init_zh_g2p: "初始化中文 G2P (misaki.zh.ZHG2P)"
  zh_config: "中文 G2P 配置: version={version} (词表原生注音: {zhuyin})"
  init_other_g2p: "初始化语言 '{lang_code}' 的 G2P 引擎"
  espeak_fallback: "未配置 espeak-ng，回退到英文 G2P: {error}"
  g2p_error: "G2P 转换异常 ('{text}'): {error}，尝试降级纯文本映射"
  phoneme_miss: "音素 '{phoneme}' (原文: '{text}') 未命中词汇表字符"
  voice_skip: "未找到混合音色中的发音人 '{voice}'，已跳过"
  blend_success: "成功创建加权融合音色: '{spec}' (混合 {count} 款声音)"
  vocab_loaded: "已成功加载 {path} 词汇表 (包含 {tokens} 个 tokens)"
  config_error: "解析 {path} 异常: {error}"
  voice_file_skip: "跳过音色文件 {name}: {error}"
  voice_archive_error: "解析打包音色 {src} 异常: {error}"
  no_preset_voices: "未在模型目录找到预置音色文件，正在初始化基础虚拟参考音色..."
  voices_loaded: "已加载 {count} 款音色 (首个音色: {first_voice})"
  loading_model: "正在加载并编译 OpenVINO 模型: {model} (设备: {device})"
  threads_set: "已设置 OpenVINO 推理线程数: {threads}"
  model_ready: "🎉 OpenVINO 模型就绪 (LATENCY 模式)"
  inference_failed: "OpenVINO 模型推理失败: {error}"
  empty_text: "收到空文本，发送静音音频流"
  request: "🎙️ TTS 请求: 语言={lang} (检测={detected}), 发音人={voice}, 语速={speed:.2f}, 文本: {text}"
  chunks_split: "长文本已切分为 {count} 个流式语音从句: {chunks}"
  chunk_output: "分句 [{index}/{total}] 流式输出完成: '{text}' (耗时: {time:.2f}s, tokens={tokens}, 音频: {duration:.2f}s)"
  synthesis_complete: "✅ 文本整篇合成与流式分发完成！"
  starting_service: "🚀 正在启动 Wyoming Kokoro-OpenVINO 多语言 TTS 服务..."
  default_voice: "🎙️ 默认发音人: {voice} (音色库总计: {count} 款声音)"
  ha_registered_langs: "🌐 已向 Home Assistant 注册语言体系: {langs}"
  cache_dir_info: "持久化模型缓存: {path}"
  bucketing_info: "Shape 分桶机制: {status} (档位: {buckets})"
  gpu_bucket_warmup: "⚡ 正在为 GPU 预热所有固定尺寸分桶内核 (档位: {buckets})..."
  gpu_warmup: "⚡ 检测到 GPU 设备，正在执行多尺度动态维度预热 (编译并缓存 GPU 内核)..."
  gpu_warmup_done: "🎉 GPU 多尺度内核预热与持久化缓存构建完成！"
  hetero_gpu_tip: "💡 提示：如果 GPU 驱动完整且算子兼容，推荐优先尝试纯 --device GPU，可避免异构跨设备拆分和内存拷贝损耗。"
  warmup_start: "正在执行后台引擎预热 (Warm-up)..."
  warmup_done: "🎉 引擎预热完成！首个请求将实现秒级出声。"
  warmup_skip: "预热跳过或忽略: {error}"
  service_ready: "🌟 Wyoming Kokoro-OpenVINO TTS 服务启动成功！"
  listen_addr: "监听地址: tcp://{host}:{port}"
  device_info: "推理设备: {device}"
  speed_info: "默认语速: {speed:.2f}"
  voice_info: "默认音色: {voice}"
  service_stopped: "服务已被手动停止。"

wyoming:
  program_description: "Kokoro-82M 多语言语音合成 (OpenVINO 高速推理)"

