cli:
  help: "Wyoming TTS 서비스 - OpenVINO 다국어 Kokoro 음성 합성"
  options:
    model_dir: "Kokoro OpenVINO 모델 디렉터리 (openvino_model.xml 및 voices/ 디렉터리 포함)"
    host: "서버 수신 호스트 주소"
    port: "서버 수신 포트 (기본값 10021)"
    device: "OpenVINO 추론 장치 (기본 CPU, Kokoro는 CPU에서 가장 빠르고 호환성 우수)"
    threads: "OpenVINO CPU 추론 스레드 수 (기본 None, 자동 최적화)"
    language: "전역 기본 언어 (auto / zh / ja / en / es / fr 등)"
    voice: "전역 기본 화자 이름 (예: zf_xiaobei, jf_alpha, af_heart, 미지정 시 자동 선정)"
    speed: "음성 속도 배율 (자연스러운 청취감을 위해 0.85 권장, >1.0 빠름, <1.0 느림)"
    sample_rate: "오디오 샘플링 속도 (Hz, Kokoro 기본값 24000)"
    cache_dir: "OpenVINO 모델 컴파일 영구 캐시 디렉터리 (기본값: 모델 디렉터리 내 .ov_cache)"
    max_chunk_chars: "스트리밍 텍스트 문장 분할 최대 문자 수 (기본값 65)"
    bucket_shapes: "입력 Shape 강제 버킷팅 활성화 (GPU 모드에서 JIT 재컴파일 지연을 방지하기 위해 기본 자동 활성화)"

