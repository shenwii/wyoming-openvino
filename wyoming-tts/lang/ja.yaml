cli:
  help: "Wyoming TTS サービス - OpenVINO 多言語 Kokoro 音声合成"
  options:
    model_dir: "Kokoro OpenVINO モデルディレクトリ (openvino_model.xml および voices/ を含む)"
    host: "サーバーのリッスンホストアドレス"
    port: "サーバーのリッスンポート (デフォルト 10021)"
    device: "OpenVINO 推論デバイス (デフォルト CPU、Kokoro は CPU で高速かつ互換性最高)"
    threads: "OpenVINO CPU 推論スレッド数 (デフォルト None で自動最適化)"
    language: "グローバルデフォルト言語 (auto / zh / ja / en / es / fr 等)"
    voice: "グローバルデフォルト話者名 (例: zf_xiaobei, jf_alpha, af_heart、未指定時は自動選出)"
    speed: "話速倍率 (自然な聴感のため 0.85 推奨、>1.0 加速、<1.0 減速)"
    sample_rate: "音声サンプリングレート (Hz、Kokoro デフォルト 24000)"
    cache_dir: "OpenVINO モデルコンパイルの永続キャッシュディレクトリ (デフォルトはモデル配下の .ov_cache)"
    max_chunk_chars: "ストリーミング文分割の最大文字数 (デフォルト 65)"
    bucket_shapes: "入力シェイプの強制バケッティングを有効化（GPUモードではJIT再コンパイル遅延を防ぐためデフォルトで自動有効）"

log:
