  loading_model: "OpenVINO モデルを読み込みコンパイル中: {model} (デバイス: {device})"
  threads_set: "OpenVINO 推論スレッド数を設定: {threads}"
  model_ready: "🎉 OpenVINO モデルの準備が完了しました (LATENCY モード)"
  inference_failed: "OpenVINO 推論に失敗しました: {error}"
  empty_text: "空テキストを受信したため無音音声を送信します"
