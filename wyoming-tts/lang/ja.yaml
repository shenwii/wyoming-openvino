  synthesis_complete: "✅ テキスト全体の合成とストリーミング配信が完了しました！"
  starting_service: "🚀 Wyoming Kokoro-OpenVINO 多言語 TTS サービスを起動しています..."
  default_voice: "🎙️ デフォルト話者: {voice} (音色ライブラリ合計: {count} 種)"
  ha_registered_langs: "🌐 Home Assistant に言語エコシステムを登録しました: {langs}"
  cache_dir_info: "永続キャッシュディレクトリ: {path}"
