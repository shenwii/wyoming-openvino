  listen_addr: "リッスンアドレス: tcp://{host}:{port}"
  device_info: "推論デバイス: {device}"
  speed_info: "デフォルト速度: {speed:.2f}"
  voice_info: "デフォルト音色: {voice}"
  service_stopped: "サービスが手動で停止されました。"

