  espeak_fallback: "espeak-ng が未設定のため、英語 G2P にフォールバック: {error}"
  g2p_error: "G2P 変換エラー ('{text}'): {error}、プレーンテキストにフォールバック"
  phoneme_miss: "音素 '{phoneme}' (テキスト: '{text}') が語彙表に見つかりません"
  voice_skip: "ブレンド対象の話者 '{voice}' が見つからないためスキップ"
  blend_success: "加重ブレンド音色を作成しました: '{spec}' ({count} 種類の音声を混合)"
  vocab_loaded: "{path} の語彙表を読み込みました ({tokens} トークン)"
  config_error: "{path} の解析中にエラー: {error}"
