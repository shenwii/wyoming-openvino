  hetero_gpu_tip: "💡 ヒント: GPUドライバがサポートされている場合は純粋な --device GPU を優先すると異種デバイス間のメモリコピーを削減できます。"
  warmup_start: "バックグラウンドでエンジンをウォームアップ中..."
