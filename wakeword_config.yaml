# ===========================================================================
# Wyoming Wake Word (唤醒词服务) 配置文件
# ===========================================================================
# 本文件用于配置 OpenVINO 硬件加速以及多个唤醒词模型的并发检测参数。
#
# 启动方式:
#   python wyoming-wakeword.py --config wakeword_config.yaml
# ===========================================================================

# --- 服务端网络配置 ---
server:
  host: "0.0.0.0"       # 监听地址 (0.0.0.0 允许局域网设备如 Home Assistant 连接)
  port: 10400           # 监听端口 (Wyoming openWakeWord 官方默认端口为 10400)
  log_level: "INFO"     # 日志级别: DEBUG / INFO / WARNING / ERROR

# --- 全局默认推理与检测参数 ---
default_device: "NPU"   # 默认推理设备: NPU (Intel Core Ultra NPU) / GPU / CPU / AUTO
                        # 具备智能硬件回退: 优先尝试 NPU，若不支持自动平滑回退至 GPU -> CPU
default_cutoff: 0.5     # 默认唤醒置信度阈值 (0.0 ~ 1.0)，建议 0.5 ~ 0.7 之间
default_refractory: 2.0 # 默认触发后的防重复冷却时间 (秒)

# --- openWakeWord 基础特征提取模型 (可选配置) ---
# 若留空或未配置，服务会自动在本地 models 目录、openwakeword 模块或 GitHub Release 中定位/下载
feature_models:
  melspec_model: "models/melspectrogram.onnx"
  embedding_model: "models/embedding_model.onnx"

# --- 唤醒词多模型列表 (支持同时监听多个唤醒词) ---
# 每个模型均可独立覆盖 cutoff (阈值)、refractory (冷却时间) 和 device (执行设备)
models:
  # 示例 1: Hey Jarvis
  - name: "hey_jarvis"
    phrase: "Hey Jarvis"
    model_path: "models/hey_jarvis_v0.1.onnx"
    cutoff: 0.6            # 单独设置更高的阈值，减少误触发
    refractory: 3.0        # 单独设置 3 秒冷却
    device: "NPU"          # 指定在 NPU 上运行
    languages:
      - "en"

  # 示例 2: Alexa
  - name: "alexa"
    phrase: "Alexa"
    model_path: "models/alexa_v0.1.onnx"
    cutoff: 0.5
    refractory: 2.0
    device: "NPU"
    languages:
      - "en"

  # 示例 3: 自定义中文唤醒词 (例如你自己训练的模型)
  # - name: "xiao_ai"
  #   phrase: "小爱同学"
  #   model_path: "models/xiao_ai.onnx"
  #   cutoff: 0.55
  #   refractory: 2.5
  #   device: "NPU"
  #   languages:
  #     - "zh"
