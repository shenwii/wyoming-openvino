# ==============================================================================
# Wyoming / openWakeWord Model Training & Data Synthesis Config (NPU Optimized)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Wake Word Definitions
# ------------------------------------------------------------------------------
wakeword:
  # Primary target wake word phrase (marked as positive sample 1.0)
  # Supports English (e.g. "hey jarvis"), Chinese (e.g. "你好小智"), Japanese, etc.
  phrase: "hey jarvis"

  # Friendly model identifier without spaces (used for output model filename: {friend_name}.onnx)
  # All primary user configurations are consolidated in this 'wakeword' block!
  friend_name: "hey_jarvis_v1"

  # Positive variant phrases / aliases (marked as positive sample 1.0)
  # Enhances acoustic tolerance for accents, variations, and connected speech
  candidate_phrases:
    - "jarvis jarvis"
    - "hi jarvis"
    - "hello jarvis"

  # Hard negatives / near-miss phrases (strictly marked as negative sample 0.0)
  # The most vital defense against false triggers! List confusable words and daily phrases.
  hard_negatives:
    - "hey harvest"
    - "hey service"
    - "hey artist"
    - "jarvis"
    - "harvest"
    - "service"
    - "turn on the lights"
    - "turn off the lights"
    - "what is the weather"

  # Language code for TTS voice selection and text frontend (e.g. en, zh, ja, es, fr)
  language: "en"


# ------------------------------------------------------------------------------
# 2. Dual-Engine Synthetic Speech Generation (Kokoro OpenVINO + Edge-TTS)
# ------------------------------------------------------------------------------
tts:
  # Output directory for synthesized speech
  output_dir: "./data/synthetic_speech"

  # Target count for positive samples (split between Kokoro and Edge-TTS)
  # Suggested: 200~500 for fast verification; 2000~5000 for production training
  target_positive_samples: 2000

  # Target count for hard negative samples (near-misses & distractors)
  # Suggested: 50% to 100% of positive sample count
  target_negative_samples: 1000

  # ----------------------------------------------------------------------------
  # Engine A: Kokoro OpenVINO TTS (Fast local offline neural synthesis)
  # ----------------------------------------------------------------------------
  kokoro:
    enabled: true
    # Model directory (auto-searched in parent directories if left empty or relative)
    model_dir: "../Kokoro-82M-int8-ov"
    # Inference device: CPU (recommended for speed and stability) or GPU (Intel GPU)
    device: "CPU"
    # Speed perturbation range [min, max] for acoustic generalization
    speed_range: [0.75, 1.25]
    # Voice list. Leave empty [] to auto-select all available voices matching language
    # English examples: ["af_heart", "af_bella", "am_adam", "am_michael"]
    # Chinese examples: ["zf_xiaobei", "zm_yunjian", "zf_xiaoni", "zm_yunxi"]
    # Japanese examples: ["jf_alpha", "jf_gongitsune", "jm_kumo"]
    voices: []
    # Weighted voice blending (e.g., 'af_heart(0.7)+am_adam(0.3)') to expand diversity
    enable_voice_blending: true

  # ----------------------------------------------------------------------------
  # Engine B: Microsoft Edge-TTS (Free high-quality cloud neural voices)
  # ----------------------------------------------------------------------------
  edge_tts:
    enabled: true
    # Perturbation ranges for acoustic variation
    rate_range: ["-20%", "+20%"]
    pitch_range: ["-15Hz", "+15Hz"]
    volume_range: ["-10%", "+10%"]
    # Voice list. Leave empty [] to auto-select curated voices matching language
    # English examples: ["en-US-JennyNeural", "en-US-GuyNeural", "en-US-AriaNeural", "en-GB-RyanNeural"]
    # Chinese examples: ["zh-CN-XiaoxiaoNeural", "zh-CN-YunxiNeural", "zh-CN-YunjianNeural"]
    # Japanese examples: ["ja-JP-NanamiNeural", "ja-JP-KeitaNeural"]
    voices: []


# ------------------------------------------------------------------------------
# 3. Noise, RIR & Negative Feature Datasets
# ------------------------------------------------------------------------------
data:
  # Root cache directory for datasets
  data_dir: "./data"

  # Dataset download URLs (supports resume and local caching)
  downloads:
    # 1. MIT Environmental Impulse Responses (~140MB)
    # Simulates real room acoustics and reverberation for various room sizes
    mit_rirs_url: "https://mcdermottlab.mit.edu/Reverb/IRMAudio/Audio.zip"

    # 2. Ambient background noise dataset (ESC-50 / AudioSet)
    # Includes fans, appliances, speech murmur, household background sounds
    noise_dataset_url: "https://github.com/karolpiczak/ESC-50/archive/master.zip"

    # 3. openWakeWord precomputed negative features (ACAV100M 2000 hours, ~2.5GB)
    # Deeply suppresses false activations during everyday TV playback and conversation
    acav100m_features_url: "https://huggingface.co/datasets/davidscripka/openwakeword_features/resolve/main/openwakeword_features_ACAV100M_2000_hrs_16bit.npy"

    # 4. False positive evaluation benchmark features (~11 hours, ~15MB)
    validation_features_url: "https://huggingface.co/datasets/davidscripka/openwakeword_features/resolve/main/validation_set_features.npy"

  # ----------------------------------------------------------------------------
  # Audio Augmentation Parameters
  # ----------------------------------------------------------------------------
  augmentation:
    # Signal-to-noise ratio (SNR) mixing range in dB (smaller = noisier)
    snr_db_range: [5.0, 25.0]

    # Probability of applying RIR room reverberation (0.0 to 1.0)
    rir_probability: 0.75

    # Maximum random silence shift in seconds (simulates wake word position in sliding window)
    time_shift_max_sec: 0.35

    # Uniform target sample rate (standard 16000 Hz, mono)
    sample_rate: 16000


# ------------------------------------------------------------------------------
# 4. Model Training & Hardware Acceleration
# ------------------------------------------------------------------------------
training:
  # Artifacts output directory
  output_dir: "./output"

  # Model name (Optional: defaults to wakeword.friend_name if omitted)
  # model_name: "hey_jarvis_v1"

  # Training hardware device: "auto", "cpu", "cuda", or "xpu" (Intel Arc / Core Ultra GPU via PyTorch XPU)
  # Note: OpenVINO is an inference runtime; PyTorch trains the neural network.
  # For Intel GPU, PyTorch 2.4+ native XPU backend or Intel Extension for PyTorch (IPEX) is supported.
  device: "auto"

  # Feature extraction inference device: "auto", "CPU", or "GPU" (Intel GPU via OpenVINO)
  feature_device: "auto"

  # Model architecture hyperparameters (fully aligned with openWakeWord specification)
  model_type: "dnn"
  context_length: 16          # History frame window (16 frames * 80ms = 1.28 seconds)
  embedding_dim: 96           # Feature embedding dimension (openWakeWord standard 96)
  layer_size: 64              # Hidden layer size (recommended: 32, 64, or 128)

  # Optimizer & training steps
  steps: 20000                # Training steps (5000 for quick test, 20000~40000 for production)
  batch_size: 128             # Batch size
  learning_rate: 0.001        # Initial learning rate
  weight_decay: 0.00001       # Weight decay
  dropout: 0.1                # Dropout rate during training

  # Negative penalty weight (openWakeWord core mechanism to prevent false triggers)
  max_negative_weight: 1500.0
  # Target false positive rate (false alarms per hour, lower is better)
  target_false_positives_per_hour: 0.2

  # ----------------------------------------------------------------------------
  # Intel NPU / OpenVINO VPUX Dedicated Optimization
  # ----------------------------------------------------------------------------
  npu_optimization:
    # Force static input shape [1, 16, 96]
    # Intel NPU requires static shapes for optimal compilation and microsecond-level latency
    force_static_shape: true
    batch_size: 1

    # ONNX Opset version (17 or 14 recommended for NPU operator compatibility)
    onnx_opset: 17

    # Operator graph purification
    # Employs Gemm (Linear) + ReLU + Sigmoid for 100% NPU hardware acceleration with zero CPU fallback
    pure_gemm_graph: true
