# ==============================================================================
# Wyoming / openWakeWord 模型训练与数据合成配置文件 (NPU 极致优化版)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 唤醒词词汇定义 (Wake Word Definitions)
# ------------------------------------------------------------------------------
wakeword:
  # 目标主唤醒词 (将被标记为正样本 1.0)
  # 支持中文 (如 "你好小智"、"小爱同学")、英文 (如 "hey jarvis")、日文等
  phrase: "你好小智"

  # 候补/变体唤醒词 (Positive Variants / Aliases)
  # 同样会被标记为正样本 1.0，用于增强对多音字、轻微口音、同音异构或变体语气的识别容忍度
  candidate_phrases:
    - "小智小智"
    - "嗨小智"
    - "小智同学"
    - "你好小志"

  # NG 负唤醒词 / 近音词 / 干扰词 (Hard Negatives / Near Misses)
  # 会被严格标记为负样本 0.0！
  # 这是抑制误唤醒（False Accept）最核心的手段！请列出容易混淆的近音词、截断词、生活常见词。
  hard_negatives:
    - "你好小夏"
    - "你好小李"
    - "你好小王"
    - "你好"
    - "你好啊"
    - "小智"
    - "小志"
    - "下雪了"
    - "小吃一条街"
    - "注意安全"
    - "天气预报"
    - "开灯"
    - "关灯"

  # 唤醒词语言代码 (用于自动挑选对应的 TTS 发音人与 G2P 音素前端)
  # 可选: zh (中文), en (英语), ja (日语), es (西班牙语), fr (法语) 等
  language: "zh"


# ------------------------------------------------------------------------------
# 2. 双引擎 TTS 合成数据生成配置 (Dual-Engine TTS Generation)
# ------------------------------------------------------------------------------
tts:
  # 合成音频输出目录
  output_dir: "./data/synthetic_speech"

  # 正样本生成目标总数 (由 Kokoro 和 Edge-TTS 协同分担生成)
  # 建议: 测试验证 200~500 个；正式生产训练 2000~5000 个
  target_positive_samples: 2000

  # NG 负样本生成目标总数 (近音词与干扰词)
  # 建议: 正样本数量的 50% ~ 100%
  target_negative_samples: 1000

  # ----------------------------------------------------------------------------
  # 引擎 A: 本项目内置 Kokoro OpenVINO TTS (极速本地离线合成)
  # ----------------------------------------------------------------------------
  kokoro:
    enabled: true
    # 模型路径 (若未指定，脚本将自动在父目录或模型目录中查找 Kokoro-82M-FP16-OpenVINO)
    model_dir: "../Kokoro-82M-FP16-OpenVINO"
    # 推理设备: CPU (推荐，CPU 推理极快且兼容性最佳) / GPU
    device: "CPU"
    # 语速变化范围 [min, max]，生成时将在此区间均匀随机采样，极大提升语速泛化力
    speed_range: [0.75, 1.25]
    # 指定发音人列表。留空 [] 时，脚本会根据 language 自动匹配所有支持的预置发音人
    # 中文示例: ["zf_xiaobei", "zm_yunjian", "zf_xiaoni", "zm_yunxi"]
    # 英文示例: ["af_heart", "af_bella", "am_adam", "am_michael"]
    # 日文示例: ["jf_alpha", "jf_gongitsune", "jm_kumo"]
    voices: []
    # 是否启用音色加权融合 (例如 'zf_xiaobei(0.7)+zm_yunjian(0.3)'，成倍扩充声学多样性)
    enable_voice_blending: true

  # ----------------------------------------------------------------------------
  # 引擎 B: 微软 Edge-TTS (免费高质量云端神经语音)
  # ----------------------------------------------------------------------------
  edge_tts:
    enabled: true
    # 语速扰动范围 (百分比，例如 "-20%" 到 "+20%")
    rate_range: ["-20%", "+20%"]
    # 音调扰动范围 (例如 "-15Hz" 到 "+15Hz")
    pitch_range: ["-15Hz", "+15Hz"]
    # 音量扰动范围 (例如 "-10%" 到 "+10%")
    volume_range: ["-10%", "+10%"]
    # 指定 Edge-TTS 发音人列表。留空 [] 时将根据语言自动选择微软精选语音
    # 中文示例: ["zh-CN-XiaoxiaoNeural", "zh-CN-YunxiNeural", "zh-CN-YunjianNeural", "zh-CN-XiaoyiNeural", "zh-CN-liaoning-XiaobeiNeural"]
    # 英文示例: ["en-US-JennyNeural", "en-US-GuyNeural", "en-US-AriaNeural", "en-GB-RyanNeural"]
    # 日文示例: ["ja-JP-NanamiNeural", "ja-JP-KeitaNeural"]
    voices: []


# ------------------------------------------------------------------------------
# 3. 噪声、混响与声学环境数据 (Noise, RIR & Negatives)
# ------------------------------------------------------------------------------
data:
  # 数据缓存根目录
  data_dir: "./data"

  # 数据集下载地址 (支持断点续传与本地缓存检测)
  downloads:
    # 1. MIT 房间冲激响应数据集 (MIT Environmental Impulse Responses, ~120MB)
    # 用于模拟客厅、卧室、办公室等不同房间尺寸与反射条件下的真实混响
    mit_rirs_url: "https://huggingface.co/datasets/davidscripka/MIT_environmental_impulse_responses/resolve/main/mit_rirs.zip"

    # 2. 背景环境噪声数据集 (AudioSet 16kHz 背景音频 / ESC-50 环境音)
    # 包含风扇、电视、家电、交谈背景音等日常生活背景声
    noise_dataset_url: "https://github.com/karolpiczak/ESC-50/archive/master.zip"

    # 3. openWakeWord 官方预计算负样本特征 (ACAV100M 2000 小时语音特征, ~2.5GB)
    # 深度防止日常对话、看电视播报时的误报
    acav100m_features_url: "https://huggingface.co/datasets/davidscripka/openwakeword_features/resolve/main/openwakeword_features_ACAV100M_2000_hrs_16bit.npy"

    # 4. 假阳性基准评估特征集 (~11 小时负样本测试集, ~15MB)
    validation_features_url: "https://huggingface.co/datasets/davidscripka/openwakeword_features/resolve/main/validation_set_features.npy"

  # ----------------------------------------------------------------------------
  # 音频合成与数据增强参数 (Audio Augmentation)
  # ----------------------------------------------------------------------------
  augmentation:
    # 信噪比 (SNR) 混合范围 (单位: dB)。值越小噪声越大，值越大越纯净
    snr_db_range: [5.0, 25.0]

    # 对生成的语音应用 RIR 房间混响的概率 (0.0 ~ 1.0)
    rir_probability: 0.75

    # 随机前后静音时间位移最大值 (单位: 秒)，模拟唤醒词在音频流中出现的随机位置
    time_shift_max_sec: 0.35

    # 统一重采样目标采样率 (openWakeWord 与 Wyoming 标准为 16000 Hz, 单声道)
    sample_rate: 16000


# ------------------------------------------------------------------------------
# 4. 模型训练与 NPU 优化配置 (Training & NPU Optimization)
# ------------------------------------------------------------------------------
training:
  # 输出产物目录
  output_dir: "./output"
  # 输出模型名称 (最终生成 ./output/{model_name}.onnx)
  model_name: "nihaoxiaozhi_v1"

  # 模型结构超参数 (与 openWakeWord 标准特征流无缝对齐)
  model_type: "dnn"
  context_length: 16          # 历史帧窗口数 (16帧 * 80ms = 1.28 秒)
  embedding_dim: 96           # 特征嵌入维度 (openWakeWord 固定为 96)
  layer_size: 64              # 全连接层隐藏单元数 (推荐 32, 64 或 128)

  # 优化器与训练步数
  steps: 20000                # 迭代步数 (快速实验建议 5000, 充分训练建议 20000~40000)
  batch_size: 128             # 批大小
  learning_rate: 0.001        # 初始学习率
  weight_decay: 0.00001       # 权重衰减
  dropout: 0.1                # 训练 Dropout 率 (导出 ONNX 时自动去除，保证推理确定性)

  # 负样本惩罚权重 (openWakeWord 核心机制: 加大负样本损失权重，强力抑制误触发)
  max_negative_weight: 1500.0
  # 目标误触发率指标 (小时误报率，越低越好)
  target_false_positives_per_hour: 0.2

  # ----------------------------------------------------------------------------
  # 针对 Intel NPU / OpenVINO VPUX 引擎的专项优化
  # ----------------------------------------------------------------------------
  npu_optimization:
    # 强制固定静态形状 [1, 16, 96]
    # Intel NPU 驱动与 VPUX 编译器对动态 Shape 非常敏感。静态 Shape 能确保:
    # 1. 100% 成功编译，绝不崩溃
    # 2. 避免驱动在运行时重新分配内存与 Shape 推导，推理延迟低至微秒级
    force_static_shape: true
    batch_size: 1

    # ONNX Opset 版本 (推荐 17 或 14，NPU 算子支持最稳定)
    onnx_opset: 17

    # 算子图纯净化优化
    # 使用由 Gemm (Linear) + ReLU + Sigmoid 组成的纯净紧凑计算图
    # 彻底杜绝 NPU 不友好的动态算子，确保零 CPU 回退 (Zero Fallback)
    pure_gemm_graph: true
