name: Release Docker Image

on:
  push:
    tags:
      - '*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - image_name: wyoming-stt
            dockerfile: ./wyoming-stt/Dockerfile
            context: ./wyoming-stt
          - image_name: wyoming-tts
            dockerfile: ./wyoming-tts/Dockerfile
            context: ./wyoming-tts
          - image_name: wyoming-wakeword
            dockerfile: ./wyoming-wakeword/Dockerfile
            context: ./wyoming-wakeword
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract version from tag
        id: vars
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: shenwii/${{ matrix.image_name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.vars.outputs.version }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
