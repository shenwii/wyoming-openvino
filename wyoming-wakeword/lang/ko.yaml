cli:
  help: "Wyoming Wake Word - OpenVINO 및 openWakeWord 기반 다중 모델 호출어 서비스"
  options:
    config: "구성 파일 경로 (YAML 또는 JSON 지원)"
    model: "로드할 하나 이상의 호출어 모델 경로 (여러 번 지정 가능)"
    model_dir: "디렉터리 내 모든 .onnx/.tflite/.xml 호출어 모델 자동 검색 및 로드"
    device: "기본 추론 계산 장치 (NPU 우선, GPU -> CPU 자동 대체) [기본값: NPU]"
    cutoff: "기본 호출 신뢰도 임계값 (0.0 ~ 1.0) [기본값: 0.5]"
    trigger_level: "호출 트리거에 필요한 연속 적중 프레임 수 (디바운스 레벨, 예: 2는 2프레임 연속 초과 요구) [기본값: 1]"
    refractory: "호출 감지 후 중복 방지 대기 시간 (초) [기본값: 2.0]"
    host: "서버 수신 호스트 주소 [기본값: 0.0.0.0]"
    port: "서버 수신 포트 [기본값: 10400]"
    log_level: "로그 기록 레벨 (DEBUG / INFO / WARNING / ERROR) [기본값: INFO]"
    melspec_model: "MelSpectrogram 특징 추출 모델 경로 (선택 사항)"
    embedding_model: "Embedding 특징 추출 모델 경로 (선택 사항)"

log:
