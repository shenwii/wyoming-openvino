  config_loaded: "구성 파일에서 서버 설정 로드 중: {path}"
  log_level_active: "로그 레벨 적용 완료: {level}"
  cmd_override_config: "명령줄에서 지정된 모델 '{name}'이(가) 구성 파일의 동일 항목을 대체합니다"
  scan_dir: "디렉터리 내 모델 파일 검색 중: {path}"
  no_models_specified: "호출어 모델이 지정되지 않았습니다! --config, --model 또는 --model-dir을 통해 모델 파일을 제공하십시오."
  service_started: "🚀 Wyoming 호출어 서비스 시작됨: {uri}"
  device_strategy: "🎯 기본 장치 정책: {device} (자동 하드웨어 대체)"
  active_list_header: "📋 활성 호출어 목록 ({count}개):"
  active_list_item: "   - [{name}] 문구: '{phrase}' | 임계값: {cutoff:.2f} | 대기: {refractory:.1f}s | 실행 장치: {device}"
  shutdown: "사용자에 의해 서비스가 중단되었습니다. 종료 중..."

wyoming:
  program_description: "OpenVINO 및 openWakeWord 기반 다중 모델 호출어 감지 서비스 (NPU/GPU/CPU 지원)"
