  in_refractory: "호출어 '{name}' 점수가 {score:.4f}에 도달했으나 쿨다운 대기 중입니다 (남은 시간: {remaining:.2f}s)"
  init_feature_pipeline: "특징 추출 파이프라인 초기화 중..."
  feature_pipeline_ready: "특징 추출 파이프라인 준비 완료: MelSpectrogram [{melspec_dev}], Embedding [{embedding_dev}]"
  no_models_loaded: "로드된 호출어 모델이 없습니다! 구성 파일 또는 명령줄에 모델을 지정하십시오."
