  download_url: "다운로드 URL: {url} -> 저장 경로: {path}"
  download_success: "'{model}' 다운로드 완료"
  read_model: "모델 읽는 중: {path}"
  compiling_model: "장치 [{device}]에서 모델 컴파일 시도 중: {name}"
  compile_success: "✅ 장치 [{device}]에 모델 로드 성공: {name}"
  compile_failed: "⚠️ 장치 [{device}]에서 모델 컴파일 실패: {error}"
  npu_reshape: "모델에 정적 형태 리셰이프 적용 중 (NPU 호환): {shapes}"
