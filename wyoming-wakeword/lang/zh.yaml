cli:
  help: "Wyoming Wake Word - 基于 OpenVINO 与 openWakeWord 的多模型唤醒词服务"
  options:
    config: "配置文件路径 (支持 YAML 或 JSON)"
    model: "指定加载的一个或多个唤醒词模型路径 (可多次指定)"
    model_dir: "自动扫描并加载该目录下所有的 .onnx/.tflite/.xml 唤醒词模型"
    device: "默认推理计算设备 (优先使用 NPU，自动回退 GPU -> CPU) [缺省: NPU]"
    cutoff: "默认唤醒置信度阈值 (0.0 ~ 1.0) [缺省: 0.5]"
    trigger_level: "连续命中防抖帧数（例如设为 2 表示必须连续 2 帧 >= 阈值才触发唤醒，专门过滤电视声等瞬时偶发误报）[缺省: 1]"
    sliding_window_size: "滑动窗口平滑大小（计算最近 N 帧分数的移动平均值，消除瞬时脉冲误报）[缺省: 1]"
    refractory: "默认唤醒触发后的防重复冷却时间 (秒) [缺省: 2.0]"
    host: "服务监听网络地址 [缺省: 0.0.0.0]"
    port: "服务监听端口 [缺省: 10400]"
    log_level: "日志记录级别 (DEBUG / INFO / WARNING / ERROR) [缺省: INFO]"
    melspec_model: "MelSpectrogram 特征提取模型路径 (可选)"
    embedding_model: "Embedding 特征提取模型路径 (可选)"

log:
  custom_path_missing: "用户指定的特征模型路径不存在: {path}，尝试自动检索"
  found_in_pkg: "在 openwakeword 模块中找到特征模型: {path}"
  download_start: "本地未检测到特征模型 '{model}'，准备从官方仓库下载..."
  download_url: "下载地址: {url} -> 保存至: {path}"
  download_success: "'{model}' 下载成功"
  read_model: "读取模型: {path}"
  compiling_model: "正在尝试在设备 [{device}] 上编译模型: {name}"
  compile_success: "✅ 成功在 [{device}] 上加载模型: {name}"
  compile_failed: "⚠️ 在设备 [{device}] 上编译模型失败: {error}"
  npu_reshape: "对模型应用静态形状重塑 (NPU 兼容): {shapes}"
  npu_reshape_failed: "模型静态形状重塑失败 (若非 NPU 运行可忽略): {error}"
  in_refractory: "唤醒词 '{name}' 分数达到 {score:.4f}，但处于冷却期 (剩余 {remaining:.2f}s)"
  init_feature_pipeline: "正在初始化特征提取流水线..."
  feature_pipeline_ready: "特征提取流水线就绪: MelSpectrogram运行于 [{melspec_dev}], Embedding运行于 [{embedding_dev}]"
  no_models_loaded: "未加载任何唤醒词模型！请在配置文件或命令行中指定模型。"
  model_embedding_based: "唤醒词 '{name}' (基于Embedding, 窗口={window}帧)"
  model_e2e_based: "唤醒词 '{name}' 识别为端到端音频模型结构 (输入长度: {samples} 采样点)"
  model_registered: "已注册唤醒词: 名称='{name}', 短语='{phrase}', 阈值={cutoff:.2f}, 连续防抖帧={trigger_level}, 滑动窗口={sliding_window_size}, 冷却={refractory:.1f}s, 设备=[{device}]"
  client_filter: "客户端指定唤醒词范围: {models}"
  client_filter_none: "客户端指定的模型均未加载: {names}，保持监听全部模型"
  inference_error: "音频帧处理或模型推理失败: {error}"
  wake_detected: "🎉 检测到唤醒词: '{name}' (短语: '{phrase}') 时间戳: {timestamp}"
  not_detected: "音频流结束未触发唤醒，发送 NotDetected 事件"
  frame_score: "模型 [{name}] 当前帧得分: {score:.4f} (阈值: {cutoff:.2f})"
  invalid_model_config: "跳过无效的模型配置项 (缺少 name 或 model_path): {item}"
  config_not_found: "指定的配置文件不存在: {path}"
  config_loaded: "从配置文件加载服务参数: {path}"
  log_level_active: "日志级别已生效并设置为: {level}"
  cmd_override_config: "命令行指定的模型 '{name}' 覆盖配置文件中的同名模型"
  scan_dir: "正在扫描目录下的模型文件: {path}"
  no_models_specified: "未指定任何唤醒词模型！请通过 --config, --model 或 --model-dir 提供模型文件。"
  service_started: "🚀 Wyoming 唤醒词服务已启动: {uri}"
  device_strategy: "🎯 默认设备策略: {device} (自动硬件回退)"
  active_list_header: "📋 活跃唤醒词列表 ({count} 个):"
  active_list_item: "   - [{name}] 短语: '{phrase}' | 阈值: {cutoff:.2f} | 冷却: {refractory:.1f}s | 运行设备: {device}"
  shutdown: "服务被用户主动中断，正在关闭..."

wyoming:
  program_description: "基于 OpenVINO 加速与 openWakeWord 的多模型唤醒词服务 (支持 NPU/GPU/CPU)"
  model_description: "OpenVINO 唤醒词: {phrase} (运行于 {device})"
