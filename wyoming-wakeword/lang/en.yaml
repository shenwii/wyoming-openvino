cli:
  help: "Wyoming Wake Word - OpenVINO Multi-Model Wake Word Service"
  options:
    config: "Configuration file path (supports YAML or JSON)"
    model: "Path to one or more wake word models to load (can be specified multiple times)"
    model_dir: "Automatically scan and load all .onnx/.tflite/.xml wake word models in directory"
    device: "Default inference device (prefers NPU, falls back GPU -> CPU) [default: NPU]"
    cutoff: "Default confidence cutoff threshold (0.0 - 1.0) [default: 0.5]"
    trigger_level: "Number of consecutive activations required to trigger wake word (debounce level, e.g. 2 requires 2 consecutive hits, filtering TV noise) [default: 1]"
    sliding_window_size: "Sliding window size for score smoothing (computes rolling average over the last N frames to suppress transient false positives) [default: 1]"
    trailing_fall: "Enable trailing-edge/peak-fall triggering (waits for wake word articulation to complete and score to drop before firing, preventing tail cutoff and STT pollution) [default: True]"
    max_trailing_frames: "Maximum trailing frames to wait for score drop before forced trigger (timeout safety guard, 80ms per frame) [default: 8]"
    trailing_raw_cutoff: "Instantaneous raw score floor for fast release (fires immediately when single frame drops below this, bypassing sliding window drain lag) [default: 0.20]"
    refractory: "Default refractory period in seconds after trigger [default: 2.0]"
    host: "Server listening host address [default: 0.0.0.0]"
    port: "Server listening port [default: 10400]"
    log_level: "Logging level (DEBUG / INFO / WARNING / ERROR) [default: INFO]"
    melspec_model: "MelSpectrogram feature model path (optional)"
    embedding_model: "Embedding feature model path (optional)"

log:
  custom_path_missing: "User specified feature model path does not exist: {path}, attempting automatic lookup"
  found_in_pkg: "Found feature model in openwakeword module: {path}"
  download_start: "Local feature model '{model}' not found, preparing to download from official repository..."
  download_url: "Download URL: {url} -> saving to: {path}"
  download_success: "'{model}' downloaded successfully"
  read_model: "Reading model: {path}"
  compiling_model: "Attempting to compile model on device [{device}]: {name}"
  compile_success: "✅ Successfully loaded model on [{device}]: {name}"
  compile_failed: "⚠️ Failed to compile model on device [{device}]: {error}"
  npu_reshape: "Applying static shape reshape for model (NPU compatibility): {shapes}"
  npu_reshape_failed: "Model static shape reshape failed (can be ignored if not running on NPU): {error}"
  in_refractory: "Wake word '{name}' score reached {score:.4f}, but in refractory period ({remaining:.2f}s remaining)"
  init_feature_pipeline: "Initializing feature extraction pipeline..."
  feature_pipeline_ready: "Feature extraction pipeline ready: MelSpectrogram on [{melspec_dev}], Embedding on [{embedding_dev}]"
  no_models_loaded: "No wake word models loaded! Please specify models in config file or command line."
  model_embedding_based: "Wake word '{name}' (Embedding-based, window={window} frames)"
  model_e2e_based: "Wake word '{name}' identified as end-to-end audio model structure (input length: {samples} samples)"
  model_registered: "Registered wake word: name='{name}', phrase='{phrase}', cutoff={cutoff:.2f}, trigger_level={trigger_level}, window_size={sliding_window_size}, trailing_fall={trailing_fall}, refractory={refractory:.1f}s, device=[{device}]"
  client_filter: "Client specified wake word filter: {models}"
  client_filter_none: "None of the client-specified models are loaded: {names}, listening to all models"
  inference_error: "Audio frame processing or model inference failed: {error}"
  wake_detected: "🎉 Wake word detected: '{name}' (phrase: '{phrase}') timestamp: {timestamp}"
  not_detected: "Audio stream ended without wake word trigger, sending NotDetected event"
  frame_score: "Model [{name}] current frame score: {score:.4f} (threshold: {cutoff:.2f})"
  invalid_model_config: "Skipping invalid model config item (missing name or model_path): {item}"
  config_not_found: "Specified config file does not exist: {path}"
  config_loaded: "Loading server configuration from file: {path}"
  log_level_active: "Logging level set to: {level}"
  cmd_override_config: "Command-line model '{name}' overrides config file entry"
  scan_dir: "Scanning directory for model files: {path}"
  no_models_specified: "No wake word models specified! Please provide models via --config, --model, or --model-dir."
  service_started: "🚀 Wyoming Wake Word Service started: {uri}"
  device_strategy: "🎯 Default device strategy: {device} (auto hardware fallback)"
  active_list_header: "📋 Active wake word list ({count} items):"
  active_list_item: "   - [{name}] Phrase: '{phrase}' | Cutoff: {cutoff:.2f} | Refractory: {refractory:.1f}s | Device: {device}"
  shutdown: "Service interrupted by user, shutting down..."

wyoming:
  program_description: "Multi-model wake word service based on OpenVINO and openWakeWord (Supports NPU/GPU/CPU)"
  model_description: "OpenVINO Wake Word: {phrase} (Running on {device})"
