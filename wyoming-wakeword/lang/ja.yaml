cli:
  help: "Wyoming Wake Word - OpenVINO と openWakeWord による複数モデル対応ウェイクワードサービス"
  options:
    config: "設定ファイルパス (YAML または JSON)"
    model: "読み込むウェイクワードモデルのパス (複数指定可能)"
    model_dir: "ディレクトリ内の全 .onnx/.tflite/.xml ウェイクワードモデルを自動スキャンして読み込む"
    device: "デフォルト推論デバイス (NPU優先、GPU -> CPU 自動フォールバック) [デフォルト: NPU]"
    cutoff: "デフォルト検出信頼度しきい値 (0.0 - 1.0) [デフォルト: 0.5]"
    trigger_level: "トリガーに必要な連続検出フレーム数 (防振レベル、例: 2は2フレーム連続超過を要求) [デフォルト: 1]"
    sliding_window_size: "スコア平滑化のためのスライディングウィンドウサイズ (直近Nフレームの移動平均を計算し誤検知を抑制) [デフォルト: 1]"
    trailing_fall: "ピーク下降トリガーを有効化 (ウェイクワードの発話完了とスコア下降を待ってから発火し、語尾の切断や後続STTの汚染を防止) [デフォルト: True]"
    max_trailing_frames: "スコア下降を待つ最大フレーム数 (タイムアウト保護、1フレーム=80ms) [デフォルト: 8]"
    trailing_raw_cutoff: "急峻なスコア降下の即時解放しきい値 (単一フレームがこの値を下回ると即時発火し、スライディングウィンドウの遅延を回避) [デフォルト: 0.20]"
    refractory: "検出後の不応期 (秒) [デフォルト: 2.0]"
    host: "サーバーのリッスンホストアドレス [デフォルト: 0.0.0.0]"
    port: "サーバーのリッスンポート [デフォルト: 10400]"
    log_level: "ログ記録レベル (DEBUG / INFO / WARNING / ERROR) [デフォルト: INFO]"
    melspec_model: "MelSpectrogram 特徴モデルパス (任意)"
    embedding_model: "Embedding 特徴モデルパス (任意)"

log:
  custom_path_missing: "指定された特徴モデルパスが存在しません: {path}。自動検索を試みます"
  found_in_pkg: "openwakeword モジュール内に特徴モデルを発見: {path}"
  download_start: "ローカルに特徴モデル '{model}' が見つかりません。公式リポジトリからダウンロードします..."
  download_url: "ダウンロード URL: {url} -> 保存先: {path}"
  download_success: "'{model}' のダウンロードが完了しました"
  read_model: "モデルを読み込み中: {path}"
  compiling_model: "デバイス [{device}] でモデルのコンパイルを試行中: {name}"
  compile_success: "✅ デバイス [{device}] でモデルを正常にロードしました: {name}"
  compile_failed: "⚠️ デバイス [{device}] でのモデルコンパイルに失敗しました: {error}"
  npu_reshape: "モデルに静的形状リシェイプを適用中 (NPU対応): {shapes}"
  npu_reshape_failed: "モデルの静的形状リシェイプに失敗しました (NPU以外で実行する場合は無視可能): {error}"
  in_refractory: "ウェイクワード '{name}' のスコアが {score:.4f} に達しましたが不応期中です (残り {remaining:.2f}s)"
  init_feature_pipeline: "特徴抽出パイプラインを初期化中..."
  feature_pipeline_ready: "特徴抽出パイプライン準備完了: MelSpectrogram [{melspec_dev}], Embedding [{embedding_dev}]"
  no_models_loaded: "ウェイクワードモデルが読み込まれていません！設定ファイルまたはコマンドラインで指定してください。"
  model_embedding_based: "ウェイクワード '{name}' (Embeddingベース, ウィンドウ={window}フレーム)"
  model_e2e_based: "ウェイクワード '{name}' をエンドツーエンド音声モデルとして識別 (入力長: {samples} サンプル)"
  model_registered: "ウェイクワード登録完了: 名前='{name}', フレーズ='{phrase}', しきい値={cutoff:.2f}, 連続フレーム={trigger_level}, ウィンドウ={sliding_window_size}, 下降トリガー={trailing_fall}, 冷却={refractory:.1f}s, デバイス=[{device}]"
  client_filter: "クライアント指定ウェイクワードスコープ: {models}"
  client_filter_none: "クライアント指定モデルが読み込まれていません: {names}。全モデルのリスニングを継続します"
  inference_error: "音声フレーム処理または推論に失敗しました: {error}"
  wake_detected: "🎉 ウェイクワード検出: '{name}' (フレーズ: '{phrase}') タイムスタンプ: {timestamp}"
  not_detected: "音声ストリーム終了 (未検出)。NotDetected イベントを送信"
  frame_score: "モデル [{name}] 現在のフレームスコア: {score:.4f} (しきい値: {cutoff:.2f})"
  invalid_model_config: "無効なモデル設定項目をスキップ (name または model_path が不足): {item}"
  config_not_found: "指定された設定ファイルが存在しません: {path}"
  config_loaded: "設定ファイルからサーバー構成を読み込み中: {path}"
  log_level_active: "ログレベルを設定: {level}"
  cmd_override_config: "コマンドライン指定のモデル '{name}' が設定ファイルの同名項目を上書きしました"
  scan_dir: "ディレクトリ内のモデルファイルをスキャン中: {path}"
  no_models_specified: "ウェイクワードモデルが指定されていません！--config, --model, または --model-dir を指定してください。"
  service_started: "🚀 Wyoming ウェイクワードサービスが開始されました: {uri}"
  device_strategy: "🎯 デフォルトデバイス方針: {device} (自動ハードウェアフォールバック)"
  active_list_header: "📋 アクティブなウェイクワード一覧 ({count} 個):"
  active_list_item: "   - [{name}] フレーズ: '{phrase}' | しきい値: {cutoff:.2f} | 冷却: {refractory:.1f}s | 実行デバイス: {device}"
  shutdown: "ユーザー操作によりサービスを中断。終了しています..."

wyoming:
  program_description: "OpenVINOとopenWakeWordによる複数モデル対応ウェイクワード検出サービス (NPU/GPU/CPU対応)"
  model_description: "OpenVINO ウェイクワード: {phrase} ({device} 上で実行)"
